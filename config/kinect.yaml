%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

# System.SaveAtlasToFile: "atlas_00"

# System.LoadAtlasFromFile: "atlas_00"

File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV), from the RGB
# /camera_info (frame kinect_rgb) recorded in bags/kinect. The previous values
# were the TUM freiburg1 Kinect calibration, not this sensor's.
Camera1.fx: 526.607
Camera1.fy: 526.607
Camera1.cx: 318.525
Camera1.cy: 241.181

Camera1.k1: 0.10265
Camera1.k2: -0.18647
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.07732

# Depth map values factor: depth[m] = raw / DepthMapFactor. bags/kinect stores
# /depth/image_raw as 16UC1 in millimetres (raw 1768 = 1.768 m in /points), so
# 1000. 5000 is the TUM dataset convention and made the map 5x too small.
RGBD.DepthMapFactor: 1000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 2000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

# Disable the ORB_SLAM3 web viewer; its blocking accept() never wakes on
# close during shutdown and the process never exits (map is not saved).
WebViewer.Enabled: 0
