services:
  orbslam:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
    image: orbslam3-modular:humble
    container_name: orbslam3
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - ./ros2_ws:/home/dev/ros2_ws
      - ./bags:/home/dev/bags
      - ./config:/home/dev/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash
